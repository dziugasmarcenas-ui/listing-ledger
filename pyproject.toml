[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "listing-ledger"
version = "0.1.0"
description = "Reconstruct listing state from duplicate, late, and corrected observations."
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.package-data]
listing_ledger = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.setuptools.packages.find]
include = ["listing_ledger*"]
